services:
  db:
    image: postgres:17-alpine
    container_name: customer-panel-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-customer_panel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-customer_panel}
      POSTGRES_DB: ${POSTGRES_DB:-customer_panel}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - customer_panel_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-customer_panel}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  customer_panel_db_data:
